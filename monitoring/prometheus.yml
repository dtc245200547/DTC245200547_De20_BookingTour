global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'tour_web'
    static_configs:
      - targets: ['tour_web:3000']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
